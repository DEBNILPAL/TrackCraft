services:
  - type: web
    name: project-progress-tracker-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATA_DIR
        value: ./data
      - key: UPLOAD_DIR
        value: ./uploads
    disk:
      name: tracker-json-storage
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

